<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --tg-theme-bg-color: #f8f9fb;
      --tg-theme-text-color: #1f2937;
      --btn-bg: #0088cc;
      --btn-text: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-border: rgba(15, 23, 42, 0.08);
      --shadow: rgba(15, 23, 42, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --tg-theme-bg-color: #131c21;
        --tg-theme-text-color: #e2e8f0;
        --btn-bg: #2a8edb;
        --btn-text: #ffffff;
        --card-bg: rgba(20, 29, 35, 0.95);
        --card-border: rgba(226, 232, 240, 0.08);
        --shadow: rgba(0, 0, 0, 0.65);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(56, 189, 248, 0.16), transparent 25%),
        var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 520px);
      padding: 32px 28px;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 28px 80px var(--shadow);
      text-align: center;
    }

    .emoji {
      width: 96px;
      height: 96px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(56, 189, 248, 0.16);
      font-size: 48px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.9rem, 2.4vw, 2.6rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 28px;
      font-size: 1rem;
      line-height: 1.8;
      opacity: 0.88;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 15px 22px;
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.16);
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 22px 44px rgba(0, 0, 0, 0.22);
    }

    .footnote {
      margin-top: 24px;
      font-size: 0.95rem;
      opacity: 0.7;
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 18px;
      }

      .emoji {
        width: 82px;
        height: 82px;
        font-size: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>Telegram Mini App</h1>
    <p>
      Telegram ichida mini ilovaga o'tish uchun pastdagi tugmani bosing. Agar mobil qurilmada bo'lsangiz,
      u avtomatik Telegram ilovasini ochishga harakat qiladi.
    </p>
    <a class="button" id="openTelegramButton" href="{{ bot_tg_link }}">
      Telegramni ochish
    </a>
    <div class="footnote">Bot: @{{ bot_username }}</div>
  </div>

  <script>
    const openButton = document.getElementById('openTelegramButton');
    const schemeLink = '{{ bot_tg_scheme }}';
    const fallbackLink = '{{ bot_tg_link }}';
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    openButton.addEventListener('click', function (event) {
      if (isMobile) {
        event.preventDefault();
        window.location.href = schemeLink;
        setTimeout(() => {
          window.location.href = fallbackLink;
        }, 1200);
      }
    });

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
    }
  </script>
</body>
</html>
